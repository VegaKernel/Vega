name: CI

on:
  push:
    branches:
      - general-devel
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add MonoMod source
        run: dotnet nuget add source https://pkgs.dev.azure.com/MonoMod/MonoMod/_packaging/DevBuilds%40Local/nuget/v3/index.json -n DevBuilds@Local

      - name: Restore TSAPI
        run: dotnet restore TerrariaServerAPI/TSAPI.sln

      - name: Build TSAPI
        run: dotnet build TerrariaServerAPI/TSAPI.sln --configuration Release --no-restore

      - name: Test TSAPI
        run: dotnet test TerrariaServerAPI/TSAPI.sln --configuration Release --no-build --filter "FullyQualifiedName!~TerrariaServerAPI.Tests.Benchmarks" --verbosity normal

      - name: Restore TShockNG
        run: dotnet restore TShock.sln

      - name: Build TShockNG
        run: dotnet build TShock.sln --configuration Release --no-restore

      - name: Test TShockNG
        run: dotnet test TShock.sln --configuration Release --no-build --verbosity normal

      - name: Pack TShockNG
        run: dotnet pack TShockAPI/TShockAPI.csproj --configuration Release --no-build --output artifacts/nuget
