name: CI

on:
  push:
    branches:
      - general-devel
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vega:
    name: Vega
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download pinned MaxMind test databases
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/maxmind/MaxMind-DB/e1120013c4b5cbc830b958b2b7e73fba444d316d/test-data"
          $target = "tests/Vega.Runtime.Tests/TestData/MaxMind"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Invoke-WebRequest "$base/GeoIP2-Country-Test.mmdb" -OutFile "$target/GeoIP2-Country-Test.mmdb"
          Invoke-WebRequest "$base/GeoLite2-ASN-Test.mmdb" -OutFile "$target/GeoLite2-ASN-Test.mmdb"
      - name: Restore Vega
        run: dotnet restore Vega.sln
      - name: Restore world-image benchmark harness
        run: dotnet restore benchmarks/Vega.WorldImage.Benchmarks/Vega.WorldImage.Benchmarks.csproj
      - name: Build Vega
        run: dotnet build Vega.sln --configuration Release --no-restore
      - name: Test Vega
        run: dotnet test Vega.sln --configuration Release --no-build --verbosity normal
      - name: Build world-image benchmark harness
        run: dotnet build benchmarks/Vega.WorldImage.Benchmarks/Vega.WorldImage.Benchmarks.csproj --configuration Release --no-restore
