name: Release Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build verified artifacts and GitHub prerelease
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<base>[0-9]+\.[0-9]+\.[0-9]+)(?<suffix>-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)$') {
            throw "Vega's prerelease channel requires a tag such as v1.0.1-preview.1; received '$env:RELEASE_TAG'."
          }
          $baseVersion = $Matches.base
          $packageVersion = "$baseVersion$($Matches.suffix)"

          [xml] $props = Get-Content -LiteralPath src/Directory.Build.props -Raw
          $projectVersion = [string] $props.Project.PropertyGroup.VersionPrefix
          if ($baseVersion -ne $projectVersion) {
            throw "Tag base version '$baseVersion' does not match VersionPrefix '$projectVersion'."
          }

          "version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100

      - name: Download pinned MaxMind test databases
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/maxmind/MaxMind-DB/e1120013c4b5cbc830b958b2b7e73fba444d316d/test-data"
          $target = "tests/Vega.Runtime.Tests/TestData/MaxMind"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Invoke-WebRequest "$base/GeoIP2-Country-Test.mmdb" -OutFile "$target/GeoIP2-Country-Test.mmdb"
          Invoke-WebRequest "$base/GeoLite2-ASN-Test.mmdb" -OutFile "$target/GeoLite2-ASN-Test.mmdb"

      - name: Restore
        run: dotnet restore src/Vega.sln

      - name: Build
        run: dotnet build src/Vega.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Vega.sln --configuration Release --no-build --no-restore --verbosity normal

      - name: Pack unified validation package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack packaging/Vega.Package/Vega.Package.csproj `
            --configuration Release `
            --output artifacts/nuget `
            -p:PackageVersion=$env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish deployable server
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/Vega.Runtime/Vega.Runtime.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --output artifacts/server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item -LiteralPath README.md -Destination artifacts/server/
          Copy-Item -LiteralPath licenses/LICENSE `
            -Destination artifacts/server/LICENSE
          Copy-Item -LiteralPath docs/en/README.md `
            -Destination artifacts/server/README_EN.md
          Set-Content -LiteralPath artifacts/server/VERSION `
            -Value $env:RELEASE_VERSION -Encoding ascii

      - name: Verify deployment layout
        shell: pwsh
        run: |
          $root = 'artifacts/server'
          $requiredRoot = @(
            'Vega.Server.exe',
            'Vega.Server.dll',
            'Vega.Server.deps.json',
            'Vega.Server.runtimeconfig.json',
            'LICENSE',
            'README.md',
            'README_EN.md',
            'VERSION'
          )
          $requiredLibraries = @(
            'Vega.Contracts.dll',
            'Vega.Backups.dll',
            'Vega.Core.dll',
            'Vega.Cluster.dll',
            'Vega.Operations.dll',
            'Vega.Persistence.dll',
            'Vega.Regions.dll',
            'Vega.Sandboxes.dll',
            'Vega.Terraria.dll',
            'Vega.TerminalUI.dll',
            'TerrariaRuntime.dll',
            'TerrariaRuntime.Hooks.dll'
          )
          $requiredPlugins = @(
            'Vega.Modules.Administration.dll',
            'Vega.Modules.AutoWorldCleaner.dll',
            'Vega.Modules.Chests.dll',
            'Vega.Modules.Mentions.dll',
            'Vega.Modules.Pvp.dll',
            'Vega.Modules.CustomItems.dll',
            'Vega.Modules.Scenes.dll',
            'Vega.Modules.Wipe.dll'
          )

          $missing = @()
          $missing += $requiredRoot |
            Where-Object { -not (Test-Path -LiteralPath (Join-Path $root $_) -PathType Leaf) }
          $missing += $requiredLibraries |
            Where-Object { -not (Test-Path -LiteralPath (Join-Path "$root/libs" $_) -PathType Leaf) }
          $missing += $requiredPlugins |
            Where-Object { -not (Test-Path -LiteralPath (Join-Path "$root/ServerPlugins" $_) -PathType Leaf) }

          if ($missing.Count -ne 0) {
            throw "Deployment layout is incomplete: $($missing -join ', ')."
          }
          if (Test-Path -LiteralPath "$root/bin" -PathType Container) {
            throw "Legacy bin directory must not be published."
          }
          if (Test-Path -LiteralPath "$root/Plugins" -PathType Container) {
            throw "Legacy Plugins directory must not be published."
          }

      - name: Smoke-test clean deployment
        shell: pwsh
        run: ./scripts/Test-DeployableServer.ps1 -ServerRoot artifacts/server

      - name: Create release artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Compress-Archive -Path artifacts/server/* `
            -DestinationPath "artifacts/release/Vega.Server-$env:RELEASE_VERSION.zip"
          Copy-Item -Path artifacts/nuget/*.nupkg `
            -Destination artifacts/release/

          Get-ChildItem artifacts/release -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          } | Set-Content -LiteralPath artifacts/release/SHA256SUMS.txt -Encoding ascii

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vega-${{ steps.version.outputs.version }}
          path: artifacts/release/*
          if-no-files-found: error

      - name: NuGet.org publication is disabled
        shell: pwsh
        run: Write-Host "Vega.nupkg is validation-only until an explicit post-debugging publication decision."

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG artifacts/release/* `
              --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $env:RELEASE_TAG artifacts/release/* `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --prerelease `
              --title "Vega $env:RELEASE_VERSION" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
