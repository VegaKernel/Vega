name: Finalize phase closure

on:
  push:
    branches:
      - agent/close-phases-15-17

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase-closure-final]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Reconstruct and verify final patch
        shell: pwsh
        run: |
          $parts = @(
            '.finalize/exact00.b64',
            '.finalize/exact01.b64',
            '.finalize/exact02.b64',
            '.finalize/exact03a.b64',
            '.finalize/exact03b.b64',
            '.finalize/exact04.b64',
            '.finalize/exact05.b64',
            '.finalize/exact06.b64',
            '.finalize/exact07.b64',
            '.finalize/exact08.b64',
            '.finalize/exact09.b64',
            '.finalize/exact10.b64'
          )
          $encoded = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          if ($encoded.Length -ne 43648) {
            throw "Unexpected base64 length: $($encoded.Length), expected 43648"
          }
          $gzipPath = '.finalize/phase-closure.patch.gz'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $hash = (Get-FileHash $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '82239d2baba02442958413ca052b8ee18e98babde742baf20e04ee03deef9b28'
          if ($hash -ne $expected) {
            throw "Payload SHA-256 mismatch: $hash"
          }
          @'
          import gzip
          from pathlib import Path
          source = Path('.finalize/phase-closure.patch.gz')
          target = Path('.finalize/phase-closure.patch')
          target.write_bytes(gzip.decompress(source.read_bytes()))
          print(f'patch-bytes={target.stat().st_size}')
          '@ | python -
          git apply --check --binary .finalize/phase-closure.patch
          git apply --index --binary .finalize/phase-closure.patch

      - name: Remove phase-closure transport
        shell: pwsh
        run: |
          git rm -r --ignore-unmatch .phase17 .finalize
          git rm --ignore-unmatch .github/workflows/phase-closure.yml
          git rm --ignore-unmatch .github/workflows/phase-closure-pr.yml
          git rm --ignore-unmatch .github/workflows/phase-closure-finalize.yml

      - name: Download pinned MaxMind test databases
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/maxmind/MaxMind-DB/e1120013c4b5cbc830b958b2b7e73fba444d316d/test-data'
          $target = 'tests/Vega.Runtime.Tests/TestData/MaxMind'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Invoke-WebRequest "$base/GeoIP2-Country-Test.mmdb" -OutFile "$target/GeoIP2-Country-Test.mmdb"
          Invoke-WebRequest "$base/GeoLite2-ASN-Test.mmdb" -OutFile "$target/GeoLite2-ASN-Test.mmdb"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore Vega.sln
          dotnet restore benchmarks/Vega.Scene.Benchmarks/Vega.Scene.Benchmarks.csproj
          dotnet restore benchmarks/Vega.Sandbox.Benchmarks/Vega.Sandbox.Benchmarks.csproj

      - name: Build
        shell: pwsh
        run: |
          dotnet build Vega.sln --configuration Release --no-restore
          dotnet build benchmarks/Vega.Scene.Benchmarks/Vega.Scene.Benchmarks.csproj --configuration Release --no-restore
          dotnet build benchmarks/Vega.Sandbox.Benchmarks/Vega.Sandbox.Benchmarks.csproj --configuration Release --no-restore

      - name: Run scene benchmark validation
        run: dotnet run --project benchmarks/Vega.Scene.Benchmarks/Vega.Scene.Benchmarks.csproj --configuration Release --no-build

      - name: Run sandbox benchmark validation
        run: dotnet run --project benchmarks/Vega.Sandbox.Benchmarks/Vega.Sandbox.Benchmarks.csproj --configuration Release --no-build

      - name: Test
        run: dotnet test Vega.sln --configuration Release --no-build --verbosity normal

      - name: Commit validated phase closure
        shell: pwsh
        run: |
          git add -A
          git diff --cached --check
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git commit -m 'Close roadmap phases 15-17 [phase-closure-final]'
          git push origin HEAD:${{ github.ref_name }}
