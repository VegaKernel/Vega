name: Runner Probe

on:
  push:
    branches:
      - agent/net10-evaluation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Show runner information
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          dotnet --info
          dotnet --list-sdks
          git --version
