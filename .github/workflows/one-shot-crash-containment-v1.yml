name: One-shot crash containment v1

on:
  push:
    branches:
      - work/crash-containment-v1

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[crash-containment-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/crash-containment-v1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply crash containment patch
        run: python3 tools/apply-crash-containment-v1.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Build Vega Core
        run: dotnet build src/Vega.Core/Vega.Core.csproj -c Release

      - name: Run PluginSdk fault-containment tests
        run: dotnet test tests/Vega.Runtime.Tests/Vega.Runtime.Tests.csproj -c Release --filter FullyQualifiedName~PluginSdkContextTests --no-restore

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Vega.Core/Modules/HotModuleRegistrationScope.cs \
                  tests/Vega.Runtime.Tests/Core/PluginSdkContextTests.cs \
                  docs/roadmap.md
          git commit -m "Contain PluginSdk callback failures [crash-containment-applied]"
          git push origin HEAD:work/crash-containment-v1
