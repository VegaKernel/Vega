name: Merge general-devel into phase closure branch

on:
  push:
    branches:
      - agent/close-phases-15-17
    paths:
      - .github/workflows/merge-general-into-phase.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/close-phases-15-17
          fetch-depth: 0

      - name: Merge current general-devel and resolve roadmap semantically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin general-devel

          set +e
          git merge --no-ff --no-commit origin/general-devel
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^docs/roadmap.md$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts require manual semantic resolution:"
              printf '%s\n' "$unexpected"
              exit 1
            fi

            git show :2:docs/roadmap.md > /tmp/roadmap-ours.md
            git show :3:docs/roadmap.md > /tmp/roadmap-theirs.md
            python3 - <<'PY'
          from pathlib import Path

          marker = "## Architectural guardrails"
          phase22 = "## Phase 22 — parallel packet pipeline and game-thread budgeting"
          ours = Path('/tmp/roadmap-ours.md').read_text(encoding='utf-8')
          theirs = Path('/tmp/roadmap-theirs.md').read_text(encoding='utf-8')

          if marker not in ours or marker not in theirs:
              raise SystemExit('roadmap guardrail marker missing')
          if phase22 not in theirs:
              raise SystemExit('general-devel is missing Phase 22+')

          ours_prefix, ours_guard = ours.split(marker, 1)
          theirs_before_guard, theirs_guard = theirs.split(marker, 1)
          later = phase22 + theirs_before_guard.split(phase22, 1)[1]

          merged_guard = marker + ours_guard
          anchor = "- `.vworld` is a cache, not a hidden second source of truth or mandatory persistence path."
          if anchor not in merged_guard:
              raise SystemExit('roadmap guardrail anchor missing')

          for line in (marker + theirs_guard).splitlines():
              if not line.startswith('- '):
                  continue
              if line not in merged_guard:
                  merged_guard = merged_guard.replace(anchor, line + '\n' + anchor, 1)

          merged = ours_prefix.rstrip() + '\n\n' + later.strip() + '\n\n' + merged_guard.lstrip()
          Path('docs/roadmap.md').write_text(merged.rstrip() + '\n', encoding='utf-8')
          PY
            git add docs/roadmap.md
          elif [ "$merge_rc" -ne 0 ]; then
            echo "Merge failed without unresolved files"
            exit "$merge_rc"
          fi

          # This workflow is transport only; the merge result must not retain it.
          git rm .github/workflows/merge-general-into-phase.yml

          # Guard against accidental reintroduction of known transport garbage.
          test ! -e .phase17
          test ! -e .finalize
          if find . -maxdepth 2 \( -name '.payload*' -o -name '*phase-closure*.yml' -o -name '*finalizer*.yml' \) -print -quit | grep -q .; then
            echo "Temporary phase transport artifacts remain"
            find . -maxdepth 2 \( -name '.payload*' -o -name '*phase-closure*.yml' -o -name '*finalizer*.yml' \) -print
            exit 1
          fi

          git status --short
          git commit -m "Merge general-devel into phase closure work"
          git push origin HEAD:agent/close-phases-15-17
