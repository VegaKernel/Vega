name: Phase closure PR validation

on:
  pull_request:
    branches:
      - general-devel

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.head_ref == 'agent/close-phases-15-17'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Apply Phase 17 implementation
        shell: pwsh
        run: |
          @'
          import base64, gzip
          from pathlib import Path
          payload = ''.join(Path(f'.phase17/part{i}.b64').read_text(encoding='utf-8') for i in range(1, 5))
          Path('phase17.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          '@ | python -
          git apply --index phase17.patch
          Remove-Item phase17.patch
      - name: Download pinned MaxMind test databases
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/maxmind/MaxMind-DB/e1120013c4b5cbc830b958b2b7e73fba444d316d/test-data"
          $target = "tests/Vega.Runtime.Tests/TestData/MaxMind"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Invoke-WebRequest "$base/GeoIP2-Country-Test.mmdb" -OutFile "$target/GeoIP2-Country-Test.mmdb"
          Invoke-WebRequest "$base/GeoLite2-ASN-Test.mmdb" -OutFile "$target/GeoLite2-ASN-Test.mmdb"
      - name: Restore
        run: dotnet restore Vega.sln
      - name: Build
        run: dotnet build Vega.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Vega.sln --configuration Release --no-build --verbosity normal
      - name: Commit validated phase closure
        shell: pwsh
        run: |
          git rm .github/workflows/phase-closure.yml .github/workflows/phase-closure-pr.yml
          git rm -r .phase17
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add -A
          git commit -m "Close Phase 17 sandbox SSC and transfer admission [phase-closure-validated]"
          git push origin HEAD:${{ github.head_ref }}
